name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project dir
        id: find
        run: |
          SPEC=$(find . -name buildozer.spec -not -path './.git/*' | head -1)
          if [ -z "$SPEC" ]; then
            echo "!! buildozer.spec not found"
            find . -type f -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "project dir: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Show repo tree
        run: |
          echo "── full file tree ──"
          find . -type f -not -path './.git/*' -not -path './.buildozer/*'

      - name: Use pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25b" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: Patch buildozer.spec
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if grep -q "^android.sdk_path" buildozer.spec; then
            sed -i "s|^android.sdk_path.*|android.sdk_path = /usr/local/lib/android/sdk|" buildozer.spec
          else
            echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          fi
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i "s|^android.accept_sdk_license.*|android.accept_sdk_license = True|" buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi
          echo "── spec tail ──"
          tail -15 buildozer.spec

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          EC=$?
          echo "═══════════════════════════════════════════"
          echo "BUILD EXIT CODE: $EC"
          echo "═══════════════════════════════════════════"
          echo "── last 100 lines of build.log ──"
          tail -100 build.log
          echo "═══════════════════════════════════════════"
          echo "── bin/ contents ──"
          ls -la bin/ 2>&1 || echo "bin/ does not exist"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexengine-apk
          path: ${{ steps.find.outputs.dir }}/bin/*.apk
          if-no-files-found: warn
