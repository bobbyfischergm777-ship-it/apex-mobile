name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: f
        run: |
          SPEC=$(find . -name buildozer.spec -not -path './.git/*' | head -1)
          [ -z "$SPEC" ] && { echo "no buildozer.spec"; find . -type f | head; exit 1; }
          DIR=$(dirname "$SPEC")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "spec=$SPEC" >> $GITHUB_OUTPUT

      - name: Patch spec (correct section)
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          # nuke any existing sdk_path / license lines wherever they are
          sed -i '/android\.sdk_path/d' buildozer.spec
          sed -i '/android\.accept_sdk_license/d' buildozer.spec

          # insert right after [app] header (this is the section buildozer reads)
          awk '
            /^\[app\]/ && !done {
              print;
              print "android.sdk_path = /usr/local/lib/android/sdk";
              print "android.accept_sdk_license = True";
              done=1;
              next;
            }
            { print }
          ' buildozer.spec > buildozer.spec.new
          mv buildozer.spec.new buildozer.spec

          echo "── relevant spec lines ──"
          grep -n "sdk_path\|accept_sdk" buildozer.spec
          echo "── first 40 lines ──"
          head -40 buildozer.spec

      - name: Pre-accept licenses in buildozer's cache
        run: |
          # buildozer caches at ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp /usr/local/lib/android/sdk/licenses/* \
             ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: Build
        working-directory: ${{ steps.f.outputs.dir }}
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25b
          ANDROIDAPI: "33"
          NDKAPI: "24"
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Show log tail
        if: always()
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          echo "═══ last 100 lines ═══"
          tail -100 build.log || echo "no log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ steps.f.outputs.dir }}/build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apexengine-apk
          path: ${{ steps.f.outputs.dir }}/bin/*.apk
          if-no-files-found: warn
