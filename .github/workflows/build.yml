name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: f
        run: |
          SPEC=$(find . -name buildozer.spec -not -path './.git/*' | head -1)
          [ -z "$SPEC" ] && { echo "no buildozer.spec"; exit 1; }
          DIR=$(dirname "$SPEC")
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Patch spec (correct section)
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          sed -i '/android\.sdk_path/d' buildozer.spec
          sed -i '/android\.accept_sdk_license/d' buildozer.spec
          sed -i '/android\.ndk_path/d' buildozer.spec
          awk '
            /^\[app\]/ && !done {
              print;
              print "android.sdk_path = /usr/local/lib/android/sdk";
              print "android.ndk_path = /usr/local/lib/android/sdk/ndk/25.2.9519653";
              print "android.accept_sdk_license = True";
              done=1; next;
            }
            { print }
          ' buildozer.spec > buildozer.spec.new
          mv buildozer.spec.new buildozer.spec
          grep -n "sdk_path\|ndk_path\|accept_sdk" buildozer.spec

      - name: Fix sdkmanager layout for buildozer 1.5
        run: |
          SDK=/usr/local/lib/android/sdk
          # buildozer looks for $SDK/tools/bin/sdkmanager — modern SDK puts it in cmdline-tools
          sudo mkdir -p $SDK/tools/bin
          for tool in sdkmanager avdmanager; do
            SRC=$(find $SDK/cmdline-tools -name $tool -type f 2>/dev/null | head -1)
            [ -n "$SRC" ] && sudo ln -sf "$SRC" $SDK/tools/bin/$tool
          done
          ls -la $SDK/tools/bin/
          $SDK/tools/bin/sdkmanager --version || echo "sdkmanager check failed"
          # verify NDK 25.2 exists
          ls /usr/local/lib/android/sdk/ndk/ || echo "no ndk dir"

      - name: Pre-accept licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: Build
        working-directory: ${{ steps.f.outputs.dir }}
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROIDAPI: "33"
          NDKAPI: "24"
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Show log tail
        if: always()
        working-directory: ${{ steps.f.outputs.dir }}
        run: tail -100 build.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ steps.f.outputs.dir }}/build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apexengine-apk
          path: ${{ steps.f.outputs.dir }}/bin/*.apk
