name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: f
        run: |
          SPEC=$(find . -name buildozer.spec -not -path './.git/*' | head -1)
          [ -z "$SPEC" ] && { echo "no buildozer.spec"; exit 1; }
          echo "dir=$(dirname $SPEC)" >> $GITHUB_OUTPUT
          find . -type f -not -path './.git/*' -not -path './.buildozer/*'
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv
      - name: Env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25b" >> $GITHUB_ENV
      - name: Patch spec
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          grep -q "^android.sdk_path" buildozer.spec || echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          grep -q "^android.accept_sdk_license" buildozer.spec || echo "android.accept_sdk_license = True" >> buildozer.spec
      - name: Build
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true
      - name: Log
        if: always()
        run: |
          echo "═══ last 100 lines ═══"
          tail -100 ${{ steps.f.outputs.dir }}/build.log 2>&1 || echo "no log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ steps.f.outputs.dir }}/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apexengine-apk
          path: ${{ steps.f.outputs.dir }}/bin/*.apk
