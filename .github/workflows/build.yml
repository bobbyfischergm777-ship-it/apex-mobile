name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: f
        run: |
          SPEC=$(find . -name buildozer.spec -not -path './.git/*' | head -1)
          [ -z "$SPEC" ] && { echo "no buildozer.spec"; exit 1; }
          DIR=$(dirname "$SPEC")
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Patch spec
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          # force Python 3.11 — Kivy 2.3.0 is incompatible with Python 3.14's C API
          sed -i 's/^requirements *=.*/requirements = python3==3.11.5,kivy==2.3.0,pyjnius,android,plyer/' buildozer.spec
          sed -i '/android\.sdk_path/d;/android\.ndk_path/d;/android\.accept_sdk_license/d' buildozer.spec
          awk '
            /^\[app\]/ && !d {
              print;
              print "android.sdk_path = /usr/local/lib/android/sdk";
              print "android.ndk_path = /usr/local/lib/android/sdk/ndk/25.2.9519653";
              print "android.accept_sdk_license = True";
              print "p4a.branch = v2023.09.02";
              d=1; next
            }
            { print }
          ' buildozer.spec > s.new && mv s.new buildozer.spec
          echo "── relevant lines ──"
          grep -n "requirements\|sdk_path\|ndk_path\|accept_sdk\|p4a.branch" buildozer.spec

      - name: Fix sdkmanager
        run: |
          SDK=/usr/local/lib/android/sdk
          sudo mkdir -p $SDK/tools/bin
          for t in sdkmanager avdmanager; do
            SRC=$(find $SDK/cmdline-tools -name $t -type f 2>/dev/null | head -1)
            [ -n "$SRC" ] && sudo ln -sf "$SRC" $SDK/tools/bin/$t
          done
          $SDK/tools/bin/sdkmanager --version
          ls $SDK/ndk/

      - name: Pre-accept licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: Build
        id: build
        working-directory: ${{ steps.f.outputs.dir }}
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROIDAPI: "33"
          NDKAPI: "24"
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Collect APKs (any path)
        if: always()
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          mkdir -p /tmp/out
          echo "── searching for APKs ──"
          find . -name "*.apk" -not -path "./.buildozer/*" -exec ls -la {} \;
          find . -name "*.apk" -not -path "./.buildozer/*" -exec cp {} /tmp/out/ \;
          ls -la /tmp/out/ || echo "no APK found anywhere"

      - name: Result
        if: always()
        working-directory: ${{ steps.f.outputs.dir }}
        run: |
          echo "═══ bin/ ═══"
          ls -la bin/ 2>&1 || echo "no bin/"
          echo ""
          echo "═══ last 200 lines of build.log ═══"
          tail -200 build.log 2>&1 || echo "no log"
          {
            echo "## Result"
            echo ""
            echo "build step outcome: **${{ steps.build.outcome }}**"
            echo ""
            echo "### bin/"
            echo '```'
            ls -la bin/ 2>&1 || echo "no bin/"
            echo '```'
            echo "### last 200 lines of build.log"
            echo '```'
            tail -200 build.log 2>&1 || echo "no log"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ steps.f.outputs.dir }}/build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apexengine-apk
          path: /tmp/out/*.apk
          if-no-files-found: warn
