name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project dir
        id: find
        run: |
          echo "── repo tree ──"
          find . -type f -not -path './.git/*' | head -50
          SPEC=$(find . -name buildozer.spec -not -path './.git/*' | head -1)
          if [ -z "$SPEC" ]; then
            echo "!! buildozer.spec not found anywhere in the repo"
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "project dir: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apexengine-apk
          path: ${{ steps.find.outputs.dir }}/bin/*.apk
          if-no-files-found: error
